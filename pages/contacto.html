<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <ul>
            <li><a href="../index.html" aria-current="page">Inicio</a></li>
            <li><a href="pages/contacto.html">Contacto Y Pedido</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>
                Visita Nuestra Restaurante Floreria
            </h2>
            <p></p>

            <div>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15605.951983201228!2d-77.05089296637797!3d-12.07870821056705!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c85fe1950f07%3A0x745d46a9c71f5566!2sFlorer%C3%ADas%20Delivery%20%7C%20Lima%20Per%C3%BA!5e0!3m2!1ses-419!2spe!4v1791292549182!5m2!1ses-419!2spe" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                title="Ubicación de Mapa Floreria, Lima"
                width="600"
                height="308"
                loading="lazy"
                referrepolicy="no-referrer-when-downgrade">
            </iframe>
            </div>

            <p>
                <strong>Horario de atención</strong> Lunes a Sábado de <b> 7:00AM </b> a <b>10:00 PM</b>

            </p>
            <hr>
        </section>

        <section>
            <h2>Haz tu pedido o Contactános</h2>

            <form action="#" method="post">
                <fieldset>
                    <legend> Datos Pedido y Contacto</legend>

                    <p>
                        <label for="contacto-nombre">Nombre Y Apellidos Completo:</label>
                        <br>
                        <input type="text" id="contacto-nombre" name="contacto-nombre" required>
                    </p>

                    <p>
                        <label for="contacto-email">Correo electronico:</label>
                        <br>
                        <input type="email" id="contacto-email" name="contacto-email" required>    
                        </label>
                    </p>

                    <p>
                        <label for="contacto-telefono">Telefono o WhatsApp (9 dígitos)</label>
                        <br>
                        <input type="tel" id="contacto-telefono" name="telefono" pattern="[0-9]{9}" required>
                    </p>

                    <p>
                        <label for="contacto-tipo">Tipo Cliente:</label>
                        <br>
                        <select id="contacto-tipo" name="tipo" required>
                            <option value="">--Seleccione una opción--</option>
                            <option value="">Cliente Nuevo</option>
                            <option value="">Cliente Frencuente</option>
                            <option value="">Cliente Mayorista</option>
                        </select>

                        <br><br>

                    </p>

                    <p>
                        <label for="contacto-mensaje">Mensaje o Detalle De Granos requeridos:</label>
                        <br>
                        <textarea id="contacto-mensaje" name="mensaje" rows="4" required></textarea>

                    </p>

                    <buttom type="submit">
                        Enviar Solicitud Pedido Floreria
                    </buttom>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
